name: Test Game Server

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Hero Skill Tests
        run: node server/test_heroes_29_40.mjs
